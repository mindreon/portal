[project]
name = "portal-api"
version = "0.1.0"
description = "Portal 内部业务系统后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.17",
    "pypdf>=5.0.0",
    "pypdfium2>=4.30.0",
    "pillow>=11.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

# 默认走阿里云 PyPI 镜像，国内 docker compose / 本机 uv sync 不用绕到 pypi.org。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic"]

[tool.ruff.lint]
# 显式选规则，避免 uvx 拉到最新 Ruff 时默认集突然变严。
# 不启用 B008 所在的 bugbear 全量：FastAPI 的 Depends() 写在参数默认值里是官方写法。
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
