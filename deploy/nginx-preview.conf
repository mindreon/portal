# 生产最外层 Nginx（portal.mindreon.com）建议加这段。
# 不要 proxy_cache 预览/下载：这是登录后的私有文件，公共缓存会串号。
# 加速靠两件事：1) 关掉缓冲，边从后端读边发给浏览器；2) 透传 Range / 304。

location /api/v1/contracts/imports/files/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header If-None-Match $http_if_none_match;
    proxy_set_header If-Modified-Since $http_if_modified_since;

    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    proxy_pass http://127.0.0.1:80;  # 改成实际反代到 Caddy 的地址
}
